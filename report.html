<div class="ph"><div><small class="dim mono">SIMULATOR</small><h2>REPORT LAB</h2></div><span class="chip-s warn">SIMULATION</span></div>
<p class="disclaimer">SIMULASI lokal. Tidak ada report yang dikirim ke platform mana pun. Gunakan label target fiktif.</p>
<div class="card sel-card" data-sender-sel aria-label="Active sender"></div>
<section class="card">
  <h3>REPORT SIMULATOR</h3>
  <label class="field"><span>TARGET (LABEL FIKTIF)</span><input class="input" id="rpTarget" type="text" maxlength="32" placeholder="demo_user_01" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
  <label class="field"><span>REPORT TYPE</span><select class="input" id="rpType"></select></label>
  <label class="field"><span>REASON</span><select class="input" id="rpReason"></select></label>
  <label class="field"><span>SIMULATION COUNT</span><select class="input" id="rpCount"></select></label>
</section>
<section class="card simbox" aria-label="Simulation">
  <div class="sim-head"><span class="sim-lab mono dim">STATUS</span><span class="sim-st dim" data-sim="status">READY</span><span class="pct" data-sim="pct">0%</span></div>
  <div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i data-sim="bar"></i></div>
  <p class="busy" data-sim="busy" hidden></p>
  <div class="sim-row"><button class="btn" type="button" data-sim="start">START REPORT SIM</button><button class="btn ghost" type="button" data-sim="stop" disabled>STOP</button><button class="btn ghost" type="button" data-sim="reset">RESET</button></div>
  <div class="result-box" data-sim="result" hidden></div>
  <div class="console" data-sim="console" role="log" aria-live="polite" aria-label="Console"></div>
  <h4 class="sub-h">ACTIVITY LOG</h4>
  <ul class="feed" data-sim="log"></ul>
</section>
