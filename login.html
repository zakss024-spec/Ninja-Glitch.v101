<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#05030c">
  <title>NINJA GLITCH - Access Portal</title>
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="preload" as="image" href="./assets/images/ninja.webp" type="image/webp">
  <link rel="preload" as="image" href="./assets/images/blackhole.webp" type="image/webp">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./responsive.css">
  <script src="./storage.js"></script>
</head>
<body data-page="login">
  <noscript>JavaScript diperlukan untuk menjalankan NINJA GLITCH.</noscript>

  <div class="bg" aria-hidden="true"><div class="bg-glow"></div><div class="bg-grid"></div></div>
  <canvas id="fx" class="fx" aria-hidden="true"></canvas>
  <div class="scan" aria-hidden="true"></div>

  <!-- ===== STAGE 1: LOGIN ===== -->
  <main class="stage" id="stage-login">
    <div class="inner">
      <div class="ring"><img data-asset="ninja" src="./assets/images/ninja.webp" alt="Ninja Glitch" width="88" height="88" decoding="async"></div>
      <h1 class="title" style="margin-top:22px">ACCESS PORTAL</h1>
      <p class="sub">LOCAL SIMULATION LOGIN</p>

      <!-- action + onsubmit: form TIDAK PERNAH reload / mengirim data ke URL -->
      <form id="loginForm" class="card login-card" action="javascript:void(0)" method="post" novalidate autocomplete="off" onsubmit="return false;">
        <label class="field">
          <span>USERNAME</span>
          <input class="input" id="username" name="ng-user" type="text" placeholder="username" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text" enterkeyhint="next" maxlength="32">
        </label>
        <label class="field">
          <span>PASSWORD</span>
          <div class="input-wrap">
            <input class="input" id="password" name="ng-pass" type="password" placeholder="••••••••" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" maxlength="64">
            <button class="eye" id="togglePass" type="button" aria-label="Tampilkan password" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </label>
        <div class="msg" id="loginMsg" role="alert" aria-live="assertive"></div>
        <button class="btn block" id="loginBtn" type="submit"><span id="loginBtnTxt">ENTER SYSTEM</span></button>
        <p class="note">Proses lokal di browser. Tidak ada data dikirim ke server.</p>
      </form>
    </div>
  </main>

  <!-- ===== STAGE 2: FINGERPRINT ===== -->
  <section class="stage" id="stage-finger">
    <div class="inner">
      <h2 class="title">BIOMETRIC AUTH</h2>
      <p class="sub">LOCAL SIMULATION SCAN</p>

      <button class="fp-btn" id="fpBtn" type="button" aria-label="Tekan untuk memulai scan fingerprint (simulasi)">
        <span class="fp-ripple"></span>
        <span class="fp-layer fp-base" aria-hidden="true">
          <svg viewBox="0 0 100 120" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round">
            <path d="M22 34 A36 36 0 0 1 78 34"/>
            <path d="M12 80 V54 A38 38 0 0 1 88 54 V72"/>
            <path d="M21 92 V56 A29 29 0 0 1 79 56 V64 M79 78 V88"/>
            <path d="M30 100 V58 A20 20 0 0 1 70 58 V94"/>
            <path d="M39 106 V60 A11 11 0 0 1 61 60 V80 M61 92 V104"/>
            <path d="M48 112 V62 A2 2 0 0 1 52 62 V76"/>
          </svg>
        </span>
        <span class="fp-layer fp-fill" aria-hidden="true">
          <svg viewBox="0 0 100 120" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round">
            <path d="M22 34 A36 36 0 0 1 78 34"/>
            <path d="M12 80 V54 A38 38 0 0 1 88 54 V72"/>
            <path d="M21 92 V56 A29 29 0 0 1 79 56 V64 M79 78 V88"/>
            <path d="M30 100 V58 A20 20 0 0 1 70 58 V94"/>
            <path d="M39 106 V60 A11 11 0 0 1 61 60 V80 M61 92 V104"/>
            <path d="M48 112 V62 A2 2 0 0 1 52 62 V76"/>
          </svg>
        </span>
        <span class="fp-line" aria-hidden="true"></span>
      </button>

      <div class="fp-pct" id="fpPct" aria-live="off">0%</div>
      <div class="status" id="fpStatus" aria-live="polite">TAP TO SCAN</div>
      <div class="fp-steps" aria-hidden="true">
        <span data-p="25">25%</span><span data-p="50">50%</span><span data-p="75">75%</span><span data-p="100">100%</span>
      </div>
      <p class="note">Simulasi UI lokal - bukan akses sensor biometrik asli.</p>
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center">
        <button class="btn ghost sm" id="fpBack" type="button">BATAL</button>
        <button class="btn ghost sm" id="fpSkip" type="button">SKIP</button>
      </div>
    </div>
  </section>

  <!-- ===== STAGE 3: NINJA LOADING ===== -->
  <section class="stage" id="stage-loading">
    <button id="ldgSkip" class="skip" type="button">SKIP</button>
    <div class="inner">
      <div class="ldg-wrap bh" style="--bh: min(74vw, 300px)" aria-hidden="true">
        <div class="bh-ring"></div>
        <div class="bh-ring r2"></div>
        <img class="bh-img" data-asset="blackhole" src="./assets/images/blackhole.webp" alt="" width="300" height="300" decoding="async">
        <div class="bh-swirl"></div>
        <div class="bh-core"></div>
        <div class="orbit"><i><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1l2.6 7.4L22 12l-7.4 3.6L12 23l-2.6-7.4L2 12l7.4-3.6z"/></svg></i></div>
        <div class="orbit o2"><i><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1l2.6 7.4L22 12l-7.4 3.6L12 23l-2.6-7.4L2 12l7.4-3.6z"/></svg></i></div>
        <div class="ninja-fly">
          <svg viewBox="0 0 120 120">
            <defs>
              <linearGradient id="lscarf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
            </defs>
            <path d="M22 112 C24 88 40 80 60 80 C80 80 96 88 98 112 Z" fill="#120a2a" stroke="#a855f7" stroke-width="2" stroke-linejoin="round"/>
            <path d="M48 82 L60 98 L72 82 Z" fill="#22d3ee" fill-opacity=".85" stroke="#4ade80" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M60 14 C41 14 31 28 31 46 C31 66 42 80 60 80 C78 80 89 66 89 46 C89 28 79 14 60 14 Z" fill="#0b0618" stroke="#a855f7" stroke-width="2.4" stroke-linejoin="round"/>
            <rect x="38" y="38" width="44" height="20" rx="10" fill="#050310" stroke="#22d3ee" stroke-width="2"/>
            <g class="eyes"><path d="M46 48 L54 44 L54 52 Z" fill="#22d3ee"/><path d="M74 48 L66 44 L66 52 Z" fill="#22d3ee"/></g>
            <path d="M33 33 C46 27 74 27 87 33" fill="none" stroke="url(#lscarf)" stroke-width="3" stroke-linecap="round"/>
            <g class="scarf-t"><path d="M86 33 C96 30 104 34 110 44 C102 42 96 44 92 50 C94 44 92 38 86 33 Z" fill="url(#lscarf)"/></g>
          </svg>
        </div>
      </div>

      <h2 class="title ldg-title"><span class="glitch glitch-shift" data-text="NINJA LOADING">NINJA LOADING</span></h2>
      <p class="sub">ENTERING THE VOID</p>

      <div class="ldg-box">
        <div class="prow"><span class="status" id="ldgStatus" style="text-align:left">INITIALIZING...</span><span class="pct" id="ldgPct">0%</span></div>
        <div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="ldgBar"></i></div>
      </div>
    </div>
  </section>

  <script src="./animation.js"></script>
  <script src="./fingerprint.js"></script>
  <script src="./image-loader.js"></script>
  <script src="./app.js"></script>
</body>
</html>
