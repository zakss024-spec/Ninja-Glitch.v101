<div class="ph"><div><small class="dim mono">LAB</small><h2>OSINT LAB</h2></div><span class="chip-s warn">SIMULATION</span></div>
<p class="disclaimer">Hasil 100% FIKTIF & acak. Jangan masukkan data pribadi orang nyata. Tidak ada pencarian nyata.</p>
<section class="card">
  <h3>DEMO INPUT</h3>
  <label class="field"><span>USERNAME</span><input class="input" id="osUser" type="text" maxlength="24" placeholder="demo_user" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
  <label class="field"><span>DOMAIN</span><input class="input" id="osDomain" type="text" maxlength="60" placeholder="demo.local" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
  <label class="field"><span>DEMO EMAIL</span><input class="input" id="osEmail" type="email" maxlength="60" placeholder="demo@demo.local" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
  <label class="field"><span>DEMO IP</span><input class="input" id="osIp" type="text" inputmode="decimal" maxlength="15" placeholder="192.0.2.10" autocomplete="off"></label>
</section>
<section class="card simbox" aria-label="Simulation">
  <div class="sim-head"><span class="sim-lab mono dim">STATUS</span><span class="sim-st dim" data-sim="status">READY</span><span class="pct" data-sim="pct">0%</span></div>
  <div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i data-sim="bar"></i></div>
  <p class="busy" data-sim="busy" hidden></p>
  <div class="sim-row"><button class="btn" type="button" data-sim="start">RUN OSINT SIMULATION</button><button class="btn ghost" type="button" data-sim="stop" disabled>STOP</button><button class="btn ghost" type="button" data-sim="reset">RESET</button></div>
  <div class="console" data-sim="console" role="log" aria-live="polite" aria-label="Console"></div>
  <h4 class="sub-h">ACTIVITY LOG</h4>
  <ul class="feed" data-sim="log"></ul>
</section>
<section class="card"><h3>RESULT</h3><div id="osRes"><p class="dim mono">Belum ada hasil. Isi minimal satu field lalu jalankan simulasi.</p></div></section>
