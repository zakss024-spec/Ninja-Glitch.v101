<div class="ph"><div><small class="dim mono">SIMULATOR</small><h2>BAN GROUP</h2></div><span class="chip-s warn">SIMULATION</span></div>
<p class="disclaimer">SIMULASI lokal. Tidak ada ban, report, atau request ke grup/platform mana pun.</p>
<div class="card sel-card" data-sender-sel aria-label="Active sender"></div>
<section class="card">
  <h3>BAN SIMULATION</h3>
  <label class="field"><span>SELECT GROUP</span><select class="input" data-group-sel></select></label>
  <div data-group-empty hidden></div>
  <label class="field"><span>REASON</span><select class="input" id="banReason"></select></label>
  <label class="field" id="banCustomWrap" hidden><span>CUSTOM REASON</span><input class="input" id="banCustom" type="text" maxlength="40" placeholder="alasan simulasi" autocomplete="off"></label>
</section>
<section class="card simbox" aria-label="Simulation">
  <div class="sim-head"><span class="sim-lab mono dim">STATUS</span><span class="sim-st dim" data-sim="status">READY</span><span class="pct" data-sim="pct">0%</span></div>
  <div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i data-sim="bar"></i></div>
  <p class="busy" data-sim="busy" hidden></p>
  <div class="sim-row"><button class="btn" type="button" data-sim="start">SIMULATE BAN</button><button class="btn ghost" type="button" data-sim="stop" disabled>STOP</button><button class="btn ghost" type="button" data-sim="reset">RESET</button></div>
  <div class="result-box" data-sim="result" hidden></div>
  <div class="console" data-sim="console" role="log" aria-live="polite" aria-label="Console"></div>
  <h4 class="sub-h">ACTIVITY LOG</h4>
  <ul class="feed" data-sim="log"></ul>
</section>
